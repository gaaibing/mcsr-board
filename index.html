<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="看板">
<meta name="theme-color" content="#07080c">
<title>看板</title>
<style>
:root{
  --bg:#07080c;--tile-1:#171c27;--tile-2:#0e1219;--tile-3:#0a0d13;
  --line:rgba(255,255,255,.085);--line-soft:rgba(255,255,255,.05);
  --text:#eef1f7;--dim:#8b95ab;--dim-2:#646d82;
  --tier:#c9ccd6;--tier-soft:rgba(201,204,214,.14);
  --warm:#ffab5e;--cool:#5cc8ff;
  --win:#3ddc84;--lose:#ff5d6c;--draw:#4aa8ff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;user-select:none;position:relative;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(110% 70% at 8% -8%,rgba(92,200,255,.10),transparent 55%),
             radial-gradient(85% 65% at 104% 104%,rgba(160,108,255,.09),transparent 60%);
}
.board{
  position:relative;z-index:1;height:100vh;height:100dvh;
  display:grid;grid-template-columns:repeat(24,1fr);grid-template-rows:repeat(20,1fr);
  gap:15px;padding:17px;
}
.tile{
  position:relative;border-radius:28px;padding:20px 24px;
  background:linear-gradient(163deg,var(--tile-1) 0%,var(--tile-2) 52%,var(--tile-3) 100%);
  border:1px solid var(--line);
  box-shadow:0 24px 52px -28px rgba(0,0,0,.95),0 2px 6px -2px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
  overflow:hidden;display:flex;flex-direction:column;
  animation:tileIn .95s cubic-bezier(.19,1.28,.32,1) both;
  transition:transform .55s cubic-bezier(.34,1.5,.64,1),border-color .4s ease,box-shadow .5s ease;
}
.tile::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.05),transparent 30%);opacity:.8;
}
@keyframes tileIn{0%{opacity:0;transform:translateY(28px) scale(.955)}60%{opacity:1}100%{opacity:1;transform:none}}

/* 拼贴布局：24 列 / 20 行。顶行两卡各占一半，下面一行左窄右宽，分割线错开 180px */
.clock{grid-area:1/1/8/13;animation-delay:.04s}
.weather{grid-area:8/1/16/9;animation-delay:.1s}
.schedule{grid-area:16/1/21/9;animation-delay:.16s}
.mcsr{grid-area:1/13/8/25;animation-delay:.22s}
.swap{grid-area:8/9/21/25;animation-delay:.28s;padding:0;overflow:hidden}

/* ============ 时钟 ============ */
/* 时钟：513px 宽，圆盘在左、日期时间在右。与充电桩左右堆叠 */
.clock{padding:0;overflow:hidden}
.cx-stack{position:absolute;inset:0;overflow:hidden}
.cx-pane{
  position:absolute;inset:0;display:flex;
  transform:translateY(100%);opacity:0;pointer-events:none;
  transition:transform .52s cubic-bezier(.22,.92,.26,1),opacity .4s ease;
  will-change:transform;
}
.cx-pane.on{transform:none;opacity:1;pointer-events:auto}
.cx-pane.up{transform:translateY(-100%);opacity:0;pointer-events:none}
.cx-pane.down{transform:translateY(100%);opacity:0;pointer-events:none}
.cx-clock{flex-direction:row;align-items:center;gap:22px;padding:20px 24px}
.dial{width:clamp(96px,18vh,136px);flex:0 0 auto;aspect-ratio:1/1}
.dial svg{width:100%;height:100%;display:block;overflow:visible}
.clock-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px;margin-top:0}
.c-date{font-size:clamp(18px,2.7vh,26px);font-weight:700;letter-spacing:-.01em;color:#fff;line-height:1.15;text-align:left;white-space:nowrap}
.c-date b{color:#fff}
.c-sub{font-size:clamp(13px,1.8vh,17px);color:var(--dim);letter-spacing:.02em;text-align:left;white-space:nowrap}
.c-time{font-size:clamp(34px,5.4vh,50px);font-weight:600;letter-spacing:-.03em;line-height:1;margin-top:6px;text-align:left}
.c-time small{font-size:.4em;font-weight:500;color:var(--dim-2);margin-left:.12em}
.daybar{height:5px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:11px}
.daybar span{
  display:block;height:100%;border-radius:99px;width:0;
  background:linear-gradient(90deg,rgba(92,200,255,.9),rgba(160,108,255,.9));
  box-shadow:0 0 14px rgba(92,200,255,.5);transition:width 1s cubic-bezier(.22,.9,.28,1);
}
.daybar-meta{display:flex;justify-content:space-between;gap:8px;margin-top:7px;font-size:11.5px;color:var(--dim-2);letter-spacing:.03em;white-space:nowrap;overflow:hidden}

/* ============ 天气 ============ */
.w-head{display:flex;align-items:center;gap:13px}
.w-temp{
  font-size:clamp(36px,6vh,56px);line-height:.9;font-weight:600;letter-spacing:-.04em;flex:0 0 auto;
  background:linear-gradient(180deg,#fff,#9fd8ff);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.w-meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.w-big{width:52px;height:52px;flex:0 0 auto;margin-left:auto;opacity:.96}
.w-big svg{width:100%;height:100%;display:block;overflow:visible}
.w-city{font-size:16px;font-weight:700;color:#e6ecf6;white-space:nowrap}
.w-desc{font-size:14px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-facts{
  display:grid;grid-template-columns:1fr 1fr;column-gap:12px;row-gap:2px;
  margin-top:10px;padding-top:9px;border-top:1px solid var(--line-soft);
}
.w-fact{font-size:13px;color:var(--dim-2);white-space:nowrap}
.w-fact b{color:#c4cddd;font-weight:600}
.w-chart{
  position:relative;flex:1;min-height:96px;margin-top:4px;
  overflow-x:auto;overflow-y:hidden;touch-action:pan-x;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.w-chart::-webkit-scrollbar{display:none}
.w-chart svg{display:block;height:100%;overflow:visible}
.w-sun{
  display:flex;align-items:center;justify-content:space-between;gap:6px;padding-top:8px;margin-top:2px;
  border-top:1px solid var(--line-soft);font-size:12.5px;color:var(--dim-2);
  white-space:nowrap;overflow:hidden;
}
.w-sun span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.w-sun b{color:#c4cddd;font-weight:600}
.ws-ic{width:16px;height:16px;flex:0 0 auto}
.ws-ic.rise{color:#ffc46b}
.ws-ic.set{color:#ff8f61}

/* ============ 充电桩 ============ */
.pg{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px;padding:14px 0 12px 16px}
.pg-head{display:flex;align-items:baseline;gap:9px;padding-right:16px}
.pg-title{font-size:15px;font-weight:800;color:#e6ecf6;letter-spacing:.02em;white-space:nowrap}
.pg-free{font-size:12.5px;font-weight:800;color:#3fd07a;white-space:nowrap}
.pg-free.none{color:#7c8698}
.pg-next{font-size:11px;color:var(--dim-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.pg-next b{color:#ffab5e;font-weight:700}
.pg-sub{margin-left:auto;font-size:11px;color:var(--dim-2);white-space:nowrap}
.pg-devs{
  display:flex;gap:8px;align-items:stretch;flex:1;min-height:0;
  overflow-x:auto;overflow-y:hidden;touch-action:pan-x;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  padding-right:16px;
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 26px),transparent 100%);
  mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 26px),transparent 100%);
}
.pg-devs::-webkit-scrollbar{display:none}
.pg-card{
  --p:0%;--fill:rgba(92,200,255,.20);
  position:relative;overflow:hidden;isolation:isolate;
  flex:0 0 auto;width:88px;border-radius:14px;padding:0 5px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  background:rgba(255,255,255,.032);border:1px solid rgba(255,255,255,.055);
  transition:background .35s ease,border-color .35s ease,box-shadow .35s ease;
}
.pg-card::before{
  content:"";position:absolute;left:0;right:0;bottom:0;height:var(--p);
  background:var(--fill);z-index:0;
  transition:height .8s cubic-bezier(.22,.92,.26,1),background .35s ease;
}
.pg-card-id,.pg-card-val,.pg-card-lab{position:relative;z-index:1}
.pg-card-id{display:flex;align-items:baseline;gap:4px;font-size:12px;line-height:1}
.pg-card-id b{font-weight:800;color:#b6c2d4;letter-spacing:.02em}
.pg-card-id i{font-style:normal;font-weight:700;color:#788392}
.pg-card-val{font-size:20px;font-weight:700;color:#c3ccdb;line-height:1;font-variant-numeric:tabular-nums}
.pg-card-lab{font-size:9.5px;color:#7c8698;line-height:1;white-space:nowrap}
.pg-card.free{
  --p:100%;--fill:linear-gradient(180deg,rgba(63,208,122,.40),rgba(63,208,122,.18));
  background:rgba(63,208,122,.05);
  border-color:rgba(63,208,122,.6);box-shadow:0 0 26px -10px rgba(63,208,122,.9);
}
.pg-card.free .pg-card-id b{color:#bdf5d3}
.pg-card.free .pg-card-val{color:#3fd07a}
.pg-card.free .pg-card-lab{color:#5fd08c}
.pg-card.soon{
  --fill:linear-gradient(180deg,rgba(255,171,94,.20),rgba(255,171,94,.07));
  border-color:rgba(255,171,94,.46);
}
.pg-card.soon .pg-card-val{color:#ffab5e}
.pg-card.over{--fill:linear-gradient(180deg,rgba(255,107,107,.28),rgba(255,107,107,.12));border-color:rgba(255,107,107,.42)}
.pg-card.over .pg-card-val{color:#ff8080}
.pg-card.over .pg-card-lab{color:#c98a8a}
.pg-card.smart{--fill:rgba(255,255,255,.055)}
.pg-card.smart .pg-card-val{color:#8e99ab;font-size:17px}
.pg-card.smart .pg-card-lab{color:#66707f}

/* ============ 课表 ============ */
.schedule{padding:13px 15px 12px;justify-content:flex-start}
.sc-body{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  padding-right:2px;
}
.sc-body::-webkit-scrollbar{display:none}
.sc-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
.sc-title{font-size:14.5px;font-weight:700;color:#e6ecf6}
.sc-sub{font-size:12px;color:var(--dim-2)}
.sc-sep{height:1px;background:var(--line-soft);margin:6px 0}
.sc-list{display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start}
.sc-item{
  flex:1 1 158px;min-width:0;height:52px;
  display:flex;flex-direction:column;justify-content:center;gap:1px;
  padding:0 11px;border-radius:12px;
  background:rgba(255,255,255,.032);border:1px solid rgba(255,255,255,.045);
  animation:scIn .65s cubic-bezier(.19,1.28,.32,1) both;
}
@keyframes scIn{0%{opacity:0;transform:translateX(14px)}100%{opacity:1;transform:none}}
.sc-item.live{
  background:linear-gradient(100deg,rgba(255,171,94,.16),rgba(255,171,94,.05));
  border-color:rgba(255,171,94,.34);box-shadow:0 0 30px -12px rgba(255,171,94,.6);
}
.sc-name{
  font-size:16.5px;font-weight:600;color:#fff;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sc-name .tag{
  font-size:10px;font-weight:600;padding:1px 5px;border-radius:5px;margin-left:6px;
  background:rgba(255,255,255,.08);color:var(--dim);vertical-align:2px;
}
.sc-where{
  font-size:12px;color:#8e99ab;
  line-height:1.3;display:flex;align-items:baseline;gap:8px;overflow:hidden;
}
.sc-where b{
  flex:0 1 auto;min-width:0;color:#c6d0df;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sc-time{
  flex:0 0 auto;font-style:normal;font-weight:700;color:var(--warm);
  letter-spacing:.01em;font-variant-numeric:tabular-nums;white-space:nowrap;
}
.schedule.dense .sc-name{font-size:15px}
.schedule.dense .sc-item{height:46px;padding:0 10px}
.schedule.dense .sc-where{font-size:11px}
.schedule.dense .sc-empty{height:46px}
.sc-empty{
  flex:1 1 100%;height:52px;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--dim-2);border:1px dashed rgba(255,255,255,.08);
  border-radius:12px;letter-spacing:.03em;
}
/* 课表加密锁 */
.sc-lock{
  position:absolute;inset:0;z-index:5;border-radius:inherit;padding:12px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(9,12,18,.9);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  transition:opacity .45s ease;
}
.sc-lock.hide{opacity:0;pointer-events:none}
.sc-lock-box{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
.sc-lock-ic{width:19px;height:19px;color:#5f6a7c}
.sc-lock-in{
  width:100%;max-width:200px;height:35px;border-radius:10px;text-align:center;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  color:#e6ecf6;font-size:13px;outline:none;font-family:inherit;
  transition:border-color .25s ease,background .25s ease;
}
.sc-lock-in:focus{border-color:rgba(92,200,255,.5);background:rgba(92,200,255,.07)}
.sc-lock-in::placeholder{color:#5f6a7c;font-size:11.5px}
.sc-lock-msg{font-size:11px;color:#6b7484;height:14px;line-height:14px}
.sc-lock-msg.err{color:#ff8080}

/* ============ MCSR ============ */
.mcsr{flex-direction:column;align-items:stretch;gap:0;padding:15px 24px 17px}
.mc-brand{flex:0 0 auto;display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:4px;min-width:0}
.mc-logo{width:22px;height:22px;display:block;border-radius:4px;image-rendering:pixelated;flex:0 0 auto}
.mc-brand span{
  font-size:11.5px;font-weight:800;letter-spacing:.13em;color:var(--dim-2);text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.mc-main{flex:1;min-height:0;display:flex;flex-direction:row;align-items:center;gap:20px}
.mc-head{width:clamp(100px,16vh,158px);flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.mc-head img{
  width:100%;height:auto;display:block;filter:drop-shadow(0 18px 30px rgba(0,0,0,.8));
  animation:headFloat 6s ease-in-out infinite;
}
@keyframes headFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.mc-body{flex:1;display:flex;flex-direction:column;min-width:0;gap:10px;justify-content:center}
.mc-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mc-rank{font-size:clamp(20px,2.9vh,29px);font-weight:700;color:var(--dim)}
.mc-flag{font-size:clamp(16px,2.2vh,21px)}
.mc-name{
  font-size:clamp(26px,4.2vh,44px);font-weight:700;letter-spacing:-.02em;color:#fff;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.mc-badge{
  display:inline-flex;align-items:center;gap:9px;padding:7px 16px 7px 12px;border-radius:99px;
  background:var(--tier-soft);border:1px solid color-mix(in srgb,var(--tier) 36%,transparent);
  color:var(--tier);font-size:clamp(16px,2.4vh,23px);font-weight:700;
  box-shadow:0 0 26px -8px color-mix(in srgb,var(--tier) 60%,transparent);
}
.mc-badge svg{width:1em;height:1em}
.mc-tierline{display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.mc-score{
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  font-size:clamp(13px,1.85vh,16.5px);color:var(--dim);
}
.mc-score b{color:#fff;font-weight:700}
.mc-score i{font-style:normal;color:var(--dim-2);opacity:.55}
.mc-peak{color:var(--dim-2);display:inline-flex;align-items:center;gap:4px}
.mc-peak b{color:var(--dim);font-weight:600}
.mc-flame{
  display:inline-flex;vertical-align:middle;align-items:center;gap:5px;padding:3px 10px 3px 8px;border-radius:99px;
  background:linear-gradient(100deg,#ff8a1e,#ff3d28);color:#fff;
  font-size:10.5px;font-weight:800;letter-spacing:.1em;line-height:1;
  box-shadow:0 7px 20px -9px rgba(255,90,30,.95),inset 0 1px 0 rgba(255,255,255,.28);
}
.mc-flame svg{width:12px;height:12px;fill:#fff;flex:0 0 auto}
.mc-rows{display:grid;grid-template-columns:1fr 1fr;gap:0;align-items:start}
.mc-col{display:flex;flex-direction:column;gap:4px;min-width:0;padding-right:13px}
.mc-col+.mc-col{padding-right:0;padding-left:13px;border-left:1px solid var(--line-soft)}
.mc-tag{font-size:11px;letter-spacing:.15em;font-weight:800;color:var(--dim);text-transform:uppercase}
.mc-vals{
  font-size:clamp(12px,1.7vh,14px);color:#b6c0d3;
  display:grid;grid-template-columns:1fr 1fr;column-gap:0;row-gap:1px;min-width:0;
  position:relative;
}
/* 块内中线的小竖线 */
.mc-vals::before{
  content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;
  background:rgba(255,255,255,.09);
}
.mc-vals .v{
  display:flex;align-items:baseline;justify-content:space-between;gap:5px;
  white-space:nowrap;overflow:hidden;padding-right:10px;
}
.mc-vals .v:nth-child(even){padding-right:0;padding-left:10px}
.mc-vals b{color:#fff;font-weight:700}
.mc-vals i{font-style:normal;color:var(--dim-2);font-size:.92em}

/* ============ 轮播 ============ */
.swap{position:relative;touch-action:none}
.swap-head{position:absolute;top:0;left:0;right:0;z-index:2;padding:19px 24px 0}
.swap-body{position:absolute;inset:44px 0 0 0;overflow:hidden}
.pane{
  position:absolute;inset:0;padding:0 24px 34px;display:flex;flex-direction:column;
  transform:translateY(-106%);opacity:0;pointer-events:none;
  transition:transform .92s cubic-bezier(.22,.92,.26,1),opacity .5s ease;
  will-change:transform;
}
.pane.active{transform:translateY(0);opacity:1;pointer-events:auto}
.pane.out-down{transform:translateY(107%);opacity:0}

.ch-wrap{position:relative;flex:1;min-height:0;margin-top:8px}
/* 折线右上角：最新一局 */
.lt-card{
  position:absolute;top:4px;right:2px;z-index:2;pointer-events:none;width:268px;
  display:flex;align-items:stretch;padding:9px 12px 10px;border-radius:14px;
  background:rgba(13,17,24,.9);border:1px solid rgba(255,255,255,.075);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  box-shadow:0 12px 30px -16px rgba(0,0,0,.95);
  font-variant-numeric:tabular-nums;
  transition:left .38s cubic-bezier(.22,.92,.26,1),top .38s cubic-bezier(.22,.92,.26,1);
}
.lt-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;padding-right:11px}
.lt-top{display:flex;align-items:baseline;gap:9px;margin-bottom:2px}
.lt-res{font-size:13.5px;font-weight:800;letter-spacing:.09em}
.lt-res.WIN{color:var(--win)}
.lt-res.LOSE{color:var(--lose)}
.lt-res.DRAW{color:var(--draw)}
.lt-time{font-size:13.5px;font-weight:700;color:#c9d2e0}
.lt-ago{margin-left:auto;font-size:11px;color:var(--dim-2);font-weight:600}
.lt-opp{font-size:12.5px;color:var(--dim-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt-opp i{font-style:normal;color:var(--dim-2);opacity:.7}
.lt-opp b{color:#e4eaf3;font-weight:700}
.lt-maps{display:flex;align-items:center;gap:7px;margin-top:3px}
.lt-ic{width:20px;height:20px;border-radius:5px;display:block;flex:0 0 auto}
.lt-side{
  flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:1px;
  padding-left:11px;border-left:1px solid rgba(255,255,255,.09);min-width:88px;
}
.lt-tier{font-size:9.5px;font-weight:800;letter-spacing:.12em;color:#cfd7e4;white-space:nowrap}
.lt-elo{display:inline-flex;align-items:center;gap:5px}
.lt-dia{width:17px;height:17px;flex:0 0 auto;color:var(--tier)}
.lt-elo b{font-size:21px;font-weight:700;color:#fff;letter-spacing:-.02em;line-height:1.05}
.lt-delta{font-size:10.5px;color:var(--dim-2);white-space:nowrap}
.lt-delta b{font-weight:800}
.lt-delta b.up{color:var(--win)}
.lt-delta b.down{color:var(--lose)}
.ch-wrap>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ch-y{position:absolute;left:0;font-size:12px;color:var(--dim-2);font-weight:600}
.ch-y.hi{top:0}
.ch-y.lo{bottom:0}

.mt-head{
  display:flex;align-items:baseline;justify-content:flex-start;gap:15px;
  font-variant-numeric:tabular-nums;line-height:1.1;
}
.mt-sum{font-size:13px;color:var(--dim-2);font-weight:700;letter-spacing:.05em;white-space:nowrap;text-transform:uppercase}
.mt-sum b{font-weight:800;margin:0 4px;color:#c3cbd9}
.mt-k{font-size:13px;color:var(--dim-2);font-weight:700;letter-spacing:.04em;white-space:nowrap}
.mt-k b{font-weight:800;margin-right:1px}
.mt-k .w{color:var(--win)}
.mt-k .l{color:var(--lose)}
.mt-k .d{color:var(--draw)}
.mt-list{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.mt-row{
  display:grid;grid-template-columns:minmax(0,1fr) 58px 66px 26px 26px 54px;
  align-items:center;gap:10px;padding:3px 12px;border-radius:11px;
  background:rgba(255,255,255,.026);border:1px solid rgba(255,255,255,.035);
  animation:mtIn .55s cubic-bezier(.19,1.28,.32,1) both;
}
@keyframes mtIn{0%{opacity:0;transform:translateY(9px)}100%{opacity:1;transform:none}}
.mt-res{font-size:12.5px;font-weight:800;letter-spacing:.09em;text-align:center}
.mt-res.WIN{color:var(--win)}
.mt-res.LOSE{color:var(--lose)}
.mt-res.DRAW{color:var(--draw)}
.mt-opp{
  font-size:14px;color:#dde4f0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.mt-time{font-size:14.5px;font-weight:600;color:#fff;text-align:center}
.mt-time.dim{color:#8d96a9}

.ic.i1{background-position:25% 0%}
.ic.i2{background-position:50% 0%}
.ic.i3{background-position:75% 0%}
.ic.i4{background-position:100% 0%}
.ic.i5{background-position:0% 100%}
.ic.i6{background-position:25% 100%}
.ic.i7{background-position:50% 100%}
.ic.i8{background-position:75% 100%}

.mt-time.ff{font-size:11px;font-weight:800;letter-spacing:.07em;color:#7c8698;text-align:center}

/* ============ 竖屏 ============ */
@media (orientation:portrait){
  html,body{overflow:auto}
  .board{height:auto;min-height:100dvh;grid-template-columns:1fr;grid-template-rows:none;gap:13px;padding:14px}
  .clock,.weather,.schedule,.mcsr,.swap{grid-area:auto}
  .clock{min-height:210px}
  .weather{min-height:330px}
  .mcsr{min-height:260px}
  .swap{min-height:440px}
  .schedule{min-height:240px}
}

</head>
<body>
<div class="board">

  <section class="tile clock" id="clockCard">
   <div class="cx-stack" id="cxStack">
    <div class="cx-pane cx-clock on" id="cxClockPane">
    <div class="dial">
      <svg viewBox="0 0 200 200">
        <defs>
          <radialGradient id="dialBg" cx="50%" cy="40%" r="64%">
            <stop offset="0%" stop-color="#1c2230"/>
            <stop offset="100%" stop-color="#0a0d13"/>
          </radialGradient>
        </defs>
        <circle cx="100" cy="100" r="94" fill="url(#dialBg)" stroke="rgba(255,255,255,.10)" stroke-width="2"/>
        <g id="ticks"></g>
        <line id="hHour" x1="100" y1="100" x2="100" y2="52" stroke="#eef1f7" stroke-width="7" stroke-linecap="round"/>
        <line id="hMin"  x1="100" y1="100" x2="100" y2="34" stroke="#eef1f7" stroke-width="4.5" stroke-linecap="round"/>
        <line id="hSec"  x1="100" y1="112" x2="100" y2="26" stroke="#5cc8ff" stroke-width="2" stroke-linecap="round"/>
        <circle cx="100" cy="100" r="5.5" fill="#5cc8ff"/>
        <circle cx="100" cy="100" r="2.2" fill="#0a0d13"/>
      </svg>
    </div>
    <div class="clock-info">
      <div class="c-date" id="cDate"><span id="cYear">—</span><b id="cMD"></b></div>
      <div class="c-sub" id="cSub">—</div>
      <div class="c-time"><span id="cHM">--:--</span><small id="cSec">00</small></div>
      <div class="daybar"><span id="daybar"></span></div>
      <div class="daybar-meta"><span id="dayLeft">—</span><span id="dayPct">—</span></div>
    </div>
    </div>
    <div class="cx-pane" id="cxPlugPane">
      <div class="pg">
        <div class="pg-head">
          <span class="pg-title">荟9 充电桩</span>
          <span class="pg-free" id="pgFree">—</span>
          <span class="pg-next" id="pgNext"></span>
          <span class="pg-sub" id="pgSub">未连接</span>
        </div>
        <div class="pg-devs" id="pgDevs"></div>
      </div>
    </div>
   </div>
  </section>

  <section class="tile weather">
    <div class="w-head">
      <div class="w-temp" id="wTemp">--°</div>
      <div class="w-meta">
        <div class="w-city" title="武汉市洪山区">洪山区 <span style="color:var(--dim-2);font-size:11px;letter-spacing:.12em">HONGSHAN</span></div>
        <div class="w-desc" id="wDesc">读取中</div>
      </div>
      <div class="w-big" id="wBig"></div>
    </div>
    <div class="w-facts">
      <span class="w-fact">体感 <b id="wFeel">--°</b></span>
      <span class="w-fact">湿度 <b id="wHum">--%</b></span>
      <span class="w-fact">风 <b id="wWind">--</b></span>
      <span class="w-fact">降水 <b id="wPop">--%</b></span>
    </div>
    <div class="w-chart">
      <svg id="wSvg" preserveAspectRatio="none" viewBox="0 0 600 150">
        <defs>
          <linearGradient id="wFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#5cc8ff" stop-opacity=".28"/>
            <stop offset="100%" stop-color="#5cc8ff" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <g id="wGrid"></g>
        <path id="wArea" fill="url(#wFill)"></path>
        <path id="wLine" fill="none" stroke="#5cc8ff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"></path>
        <g id="wNodes"></g>
      </svg>
    </div>
    <div class="w-sun">
      <span><svg class="ws-ic rise" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18.5h18"/><path d="M8 18.5a4 4 0 0 1 8 0"/><path d="M12 10V4.5"/><path d="M9.6 6.9L12 4.5l2.4 2.4"/></svg>日出 <b id="wRise">--:--</b></span>
      <span><svg class="ws-ic set" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18.5h18"/><path d="M8 18.5a4 4 0 0 1 8 0"/><path d="M12 3.5V9"/><path d="M9.6 6.6L12 9l2.4-2.4"/></svg>日落 <b id="wSet">--:--</b></span>
      <span style="margin-left:auto" class="w-range">今日 <b id="wRange">--° / --°</b></span>
    </div>
  </section>

  <section class="tile schedule" id="schedCard">
    <div class="sc-body">
      <div class="sc-head"><span class="sc-title" id="todayTitle">今天</span><span class="sc-sub" id="todaySub">—</span></div>
      <div class="sc-list" id="todayList"></div>
      <div class="sc-sep"></div>
      <div class="sc-head"><span class="sc-title" id="tmrTitle">明天</span><span class="sc-sub" id="tmrSub">—</span></div>
      <div class="sc-list" id="tmrList"></div>
    </div>
    <div class="sc-lock" id="scLock">
      <div class="sc-lock-box">
        <svg class="sc-lock-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10.5" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
        <input id="ttPass" class="sc-lock-in" type="password" placeholder="课表已加密，输入口令" autocomplete="current-password" enterkeyhint="go">
        <div class="sc-lock-msg" id="ttMsg"></div>
      </div>
    </div>

function tierOf(elo){
  const t = TIERS.find(x => elo >= x.min && elo <= x.max) || TIERS[0];
  if (t.noDiv) return {tier:t, label:t.name};
  const span = t.max - t.min + 1;
  const idx = Math.min(2, Math.floor((elo - t.min) / (span / 3)));
  return {tier:t, label:`${t.name} ${["I","II","III"][idx]}`};
}
function hexA(hex,a){
  const h = hex.replace("#","");
  return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`;
}

  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
function ago(ts){
  const s = Date.now()/1000 - ts;
  if (s < 60) return "now";
  if (s < 3600) return Math.floor(s/60) + "min";
  if (s < 86400) return Math.floor(s/3600) + "h";
  if (s < 86400*7) return Math.floor(s/86400) + "d";
  if (s < 86400*30) return Math.floor(s/86400/7) + "w";
  if (s < 86400*365) return Math.floor(s/86400/30) + "m";
  return Math.floor(s/86400/365) + "y";
}

function weekOf(d){
  const t0 = new Date(CFG.semesterStart + "T00:00:00");
  const t1 = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  return Math.max(1, Math.floor(Math.floor((t1 - t0) / 86400000) / 7) + 1);
}
function periodTime(i){
  const [a,b] = CFG.periods[i-1] || ["00:00","00:00"];
  const toMin = s => { const [h,m] = s.split(":").map(Number); return h*60+m; };
  return {start:toMin(a), end:toMin(b), a, b};
}
function nowMin(){ const n = new Date(); return n.getHours()*60 + n.getMinutes() + n.getSeconds()/60; }
function coursesOn(date, week){
  const d = date.getDay() === 0 ? 7 : date.getDay();
  return TIMETABLE.filter(c => c.d === d && c.w.includes(week)).sort((a,b) => a.s - b.s);
}

(function ticks(){
  const g = $("ticks");
  for (let i = 0; i < 60; i++){
    const big = i % 5 === 0;
    const a = (i/60) * Math.PI * 2;
    const r1 = big ? 78 : 84, r2 = 88;
    const ln = document.createElementNS(NS, "line");
    ln.setAttribute("x1", 100 + Math.sin(a)*r1);
    ln.setAttribute("y1", 100 - Math.cos(a)*r1);
    ln.setAttribute("x2", 100 + Math.sin(a)*r2);
    ln.setAttribute("y2", 100 - Math.cos(a)*r2);
    ln.setAttribute("stroke", big ? "rgba(255,255,255,.42)" : "rgba(255,255,255,.13)");
    ln.setAttribute("stroke-width", big ? 2.6 : 1.3);
    ln.setAttribute("stroke-linecap", "round");
    g.appendChild(ln);
  }
})();

let __lastDay = -1;
function tickClock(){
  const n = new Date();
  const h = n.getHours(), m = n.getMinutes(), s = n.getSeconds();
  $("hSec").setAttribute("transform", `rotate(${s*6} 100 100)`);
  $("hMin").setAttribute("transform", `rotate(${m*6 + s*0.1} 100 100)`);
  $("hHour").setAttribute("transform", `rotate(${(h%12)*30 + m*0.5} 100 100)`);

  $("cHM").textContent = `${pad(h)}:${pad(m)}`;
  $("cSec").textContent = pad(s);
  if (n.getDate() !== __lastDay){
    __lastDay = n.getDate();
    $("cYear").textContent = `${n.getFullYear()}年`;
    $("cMD").textContent = `${n.getMonth()+1}月${n.getDate()}日`;
    $("cSub").textContent = `${WEEK_CN[n.getDay()]} · 第 ${weekOf(n)} 周`;
  }

  const mins = nowMin();
  const pct = Math.min(100, mins/1440*100);
  $("daybar").style.width = pct.toFixed(2) + "%";
  const left = 1440 - mins;
  $("dayLeft").textContent = `今天还剩 ${Math.floor(left/60)} 小时 ${Math.floor(left%60)} 分`;
  $("dayPct").textContent = `${pct.toFixed(1)}% 已过`;

  tickPlug();
}

let __plug = null;

function fmtCd(sec){
  sec = Math.max(0, Math.floor(sec));
  if (sec < 60) return sec + "s";
  if (sec < 3600) return Math.floor(sec/60) + "m" + pad(sec%60) + "s";
  return Math.floor(sec/3600) + "h" + pad(Math.floor(sec%3600/60));
}

function plugShell(){
  const box = $("pgDevs");
  if (!box) return;
  const ds = (__plug && __plug.devices) || [];
  let html = "";
  ds.forEach((d, di) => {
    const tag = d.tag || d.name.replace(/^荟园\d+栋/, "").replace(/号$/, "");
    d.ports.forEach(p => {
      html += `<div class="pg-card" data-di="${di}" data-pn="${p.n}">`
        + `<div class="pg-card-id"><b>${tag}</b><i>${p.n}</i></div>`
        + `<div class="pg-card-val">--</div>`
        + `<div class="pg-card-lab">·</div></div>`;
    });
  });
  box.innerHTML = html;
  __plugOrderKey = "";
  applyPlugOrder();
}

// 排序：空闲 → 定时充（剩余由短到长）→ 智能充（已用由长到短）
let __plugOrderKey = "";
function applyPlugOrder(){
  const box = $("pgDevs");
  if (!box || !__plug || !__plug.devices) return;
  const cells = Array.from(box.children).map(el => {
    const d = __plug.devices[+el.dataset.di];
    const p = d && d.ports.find(x => x.n === +el.dataset.pn);
    return p ? { el, p } : null;
  }).filter(Boolean);

  const isSmart = p => p.s !== 1 && (p.m || p.u || !p.d);
  const free  = cells.filter(x => x.p.s === 1);
  const timed = cells.filter(x => x.p.s !== 1 && !isSmart(x.p)).sort((a, b) => a.p.d - b.p.d);
  const smart = cells.filter(x => x.p.s !== 1 && isSmart(x.p)).sort((a, b) => a.p.t - b.p.t);
  const ordered = free.concat(timed, smart);

  const key = ordered.map(x => x.el.dataset.di + "-" + x.el.dataset.pn).join(",");
  if (key === __plugOrderKey) return;
  __plugOrderKey = key;
  ordered.forEach((x, i) => { x.el.style.order = i; });
}

function tickPlug(){
  if (!__plug || !__plug.devices || !__plug.devices.length) return;
  const box = $("pgDevs");
  if (!box) return;
  const now = Date.now() / 1000;
  let fAll = 0, cAll = 0;
  let nextD = null, nextP = null;

  for (const el of box.children){
    const d = __plug.devices[+el.dataset.di];
    if (!d) continue;
    const p = d.ports.find(x => x.n === +el.dataset.pn);
    if (!p) continue;
    const val = el.querySelector(".pg-card-val");
    const lab = el.querySelector(".pg-card-lab");
    el.className = "pg-card";
    const setP = v => el.style.setProperty("--p", (v <= 0 ? 0 : v >= 100 ? 100 : v).toFixed(1) + "%");
    if (p.s === 1){
      fAll++;
      el.classList.add("free");
      val.textContent = "空";
      lab.textContent = "可充";
      setP(100);
    } else if (p.m || p.u || !p.d){
      el.classList.add("smart");
      val.textContent = fmtCd(now - p.t);
      lab.textContent = "已用";
      setP((now - p.t) / 32400 * 100);          // 智能充按 9 小时上限估个进度
    } else if (p.d <= now){
      el.classList.add("over");
      val.textContent = "到时";
      lab.textContent = "待确认";
      setP(100);
    } else {
      const left = p.d - now;
      if (left < 1800) el.classList.add("soon");
      val.textContent = fmtCd(left);
      lab.textContent = "剩余";
      const span = p.d - p.t;
      setP(span > 0 ? (now - p.t) / span * 100 : 0);
      if (!nextD || p.d < nextD){
        nextD = p.d; nextP = d.tag + " " + p.n;
      }
    }
  }

  __plug.devices.forEach(d => { cAll += d.count || d.ports.length; });

  const pf = $("pgFree");
  if (pf){
    pf.textContent = `空闲 ${fAll}/${cAll}`;
    pf.classList.toggle("none", fAll === 0);
  }

  const nx = $("pgNext");
  if (nx){
    if (fAll > 0){ nx.innerHTML = ""; }
    else if (nextP){ nx.innerHTML = `最快 <b>${nextP}</b> ${fmtCd(nextD - now)}`; }
    else { nx.textContent = "全是智能充"; }
  }

  const at = (__plug.devices[0] || {}).at;
  if (at){
    const age = Math.max(0, Math.round(now - at));
    $("pgSub").textContent = age < 90 ? `${age}s 前采集` : `${Math.round(age/60)}min 前采集`;
  }
}

async function loadPlug(){
  if (!CFG.plugUrl) return;
  try{
    const r = await fetch(CFG.plugUrl, {cache:"no-store", signal:AbortSignal.timeout(8000)});
    if (!r.ok) throw new Error("http " + r.status);
    const d = await r.json();
    if (!d || !Array.isArray(d.devices) || !d.devices.length) throw new Error("bad payload");
    // 固定设备顺序，并生成短标签（东1 / 东2）
    d.devices.sort((a, b) => a.name.localeCompare(b.name, "zh"));
    d.devices.forEach(x => { x.tag = x.name.replace(/^荟园\d+栋/, "").replace(/号$/, ""); });
    const rebuild = !__plug || __plug.devices.length !== d.devices.length
      || __plug.devices.some((x, i) => x.name !== d.devices[i].name);
    __plug = d;
    if (rebuild) plugShell();
    else applyPlugOrder();
    tickPlug();
  }catch(e){
    const s = $("pgSub");
    if (s) s.textContent = "中转不可用";
  }
}

const CX = { idx: 0 };
function cxGo(i, dir){
  // dir = 1：手指上滑，当前页往上走、新页从下面来
  // dir = -1：手指下滑，当前页往下走、新页从上面来
  if (dir === undefined) dir = 1;
  CX.idx = i;
  const a = $("cxClockPane"), b = $("cxPlugPane");
  if (!a || !b) return;
  const list = [a, b];
  const next = list[i], cur = list[1 - i];

  // 先把目标无过渡地摆到进入侧，避免从对侧横穿整个卡片
  next.classList.remove("on");
  next.style.transition = "none";
  next.classList.remove("up", "down");
  next.classList.add(dir > 0 ? "down" : "up");
  void next.offsetWidth;
  next.style.transition = "";

  requestAnimationFrame(() => {
    cur.classList.remove("on");
    cur.classList.add(dir > 0 ? "up" : "down");
    next.classList.remove("up", "down");
    next.classList.add("on");
  });

  if (i === 1) loadPlug();
}
(function cxSwipe(){
  const el = $("cxStack");
  if (!el) return;
  let x0 = 0, y0 = 0, t0 = 0, down = false;
  el.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    down = true; x0 = e.clientX; y0 = e.clientY; t0 = performance.now();
  });
  el.addEventListener("pointerup", e => {
    if (!down) return;
    down = false;
    if (performance.now() - t0 > 1000) return;
    const dx = e.clientX - x0, dy = e.clientY - y0;
    // 上下滑切页，横向留给充电桩列表自己滚
    if (Math.abs(dy) < 45 || Math.abs(dy) < Math.abs(dx) * 1.2) return;
    cxGo(CX.idx === 0 ? 1 : 0, dy < 0 ? 1 : -1);
  });
  el.addEventListener("pointercancel", () => { down = false; });
})();

function courseHTML(c, live, idx){

  const span = c.e > c.s ? `${c.s}-${c.e}` : `${c.s}`;

    <span class="sc-where"><b>${c.p}</b><em class="sc-time">${st.a}–${et.b}</em></span>
  </div>`;
}
function renderSchedule(){
  if (!TIMETABLE || !TIMETABLE.length) return;
  const now = new Date(), w = weekOf(now), mins = nowMin();
  const today = coursesOn(now, w);
  const remain = today.filter(c => periodTime(c.e).end > mins);
  $("todayTitle").textContent = `今天 · ${WEEK_SHORT[now.getDay()]}`;
  $("todaySub").textContent = today.length ? `第 ${w} 周 · 剩 ${remain.length}/${today.length} 节` : `第 ${w} 周 · 无课`;
  $("todayList").innerHTML = remain.length
    ? remain.map((c,i) => courseHTML(c, periodTime(c.s).start <= mins, i)).join("")
    : `<div class="sc-empty">${today.length ? "今天的课都上完了" : "今天没有课"}</div>`;

  const tmr = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1);
  const list = coursesOn(tmr, weekOf(tmr));

/* ============ 课表解锁（AES-GCM） ============ */
const TT_LSK = "tt.pass";
async function ttDecrypt(pass){
  const bin = atob(TT_ENC);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: buf.subarray(0, 16), iterations: 120000, hash: "SHA-256" },
    km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
  );
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.subarray(16, 28) }, key, buf.subarray(28));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function ttTry(pass, silent){
  const msg = $("ttMsg");
  try{
    TIMETABLE = await ttDecrypt(pass);
    localStorage.setItem(TT_LSK, pass);
    $("scLock").classList.add("hide");
    if (msg){ msg.textContent = ""; msg.classList.remove("err"); }
    renderSchedule();
    return true;
  }catch(e){
    if (!silent && msg){
      msg.textContent = "口令不对";
      msg.classList.add("err");
      $("ttPass").value = "";
      $("ttPass").focus();
    }
    return false;
  }
}
(function ttBoot(){
  const inp = $("ttPass");
  if (!inp) return;
  if (typeof TT_ENC === "undefined"){
    $("scLock").classList.add("hide");
    return;
  }
  const saved = localStorage.getItem(TT_LSK);
  if (saved){
    ttTry(saved, true).then(ok => {
      if (!ok){ localStorage.removeItem(TT_LSK); setTimeout(() => inp.focus(), 500); }
    });
  } else {
    setTimeout(() => inp.focus(), 700);
  }
  inp.addEventListener("keydown", e => {
    if (e.key === "Enter"){
      const v = inp.value.trim();
      if (v) ttTry(v, false);
    }
  });
  inp.addEventListener("input", () => {
    const m = $("ttMsg");
    if (m){ m.textContent = ""; m.classList.remove("err"); }
  });
})();

function drawWeather(h, idx){
  if (!idx.length) return;
  const wrap = document.querySelector(".w-chart");
  const cw = Math.max(240, wrap.clientWidth || 240);
  const H = Math.max(90, wrap.clientHeight || 120);
  // 12 小时数据画成约 2.1 倍宽，首屏正好看 6 个小时，其余横滑
  // 12 小时数据按"一屏正好 5 个整点"排布，其余横滑
  // 44 = 左右各 22 的内边距；-88 让第 5 个整点落在可视区右侧 26px 处，
  // 否则它正好压在容器边缘，时间和图标会被切掉一半
  const W = Math.max(cw + 60, Math.round(cw * 11 / 4 - 88));
  const svg = $("wSvg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.style.width = W + "px";
  svg.style.height = H + "px";

  const XL = 22, XR = 22, PT = 50, PB = 26;
  const plotW = W - XL - XR, plotH = H - PT - PB;
  const vals = idx.map(i => h.temperature_2m[i]);
  let lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  const padV = Math.max(1.5, (hi-lo)*0.75);
  lo -= padV; hi += padV;

  const nx = i => XL + (idx.length <= 1 ? plotW/2 : (i/(idx.length-1)) * plotW);
  const ny = v => PT + (1 - (v-lo)/(hi-lo)) * plotH;

  const grid = $("wGrid");
  grid.textContent = "";
  for (let i = 0; i <= 2; i++){
    const y = PT + (plotH*i)/2;
    const ln = document.createElementNS(NS, "line");
    ln.setAttribute("x1", XL); ln.setAttribute("x2", W-XR);
    ln.setAttribute("y1", y); ln.setAttribute("y2", y);
    ln.setAttribute("stroke", "rgba(255,255,255,.06)");
    ln.setAttribute("stroke-dasharray", "2 6");
    grid.appendChild(ln);
  }

  const pts = idx.map((i,k) => [nx(k), ny(h.temperature_2m[i])]);
  let d = "";
  pts.forEach((p,k) => { d += (k ? " L " : "M ") + p[0].toFixed(1) + " " + p[1].toFixed(1); });
  $("wLine").setAttribute("d", d);
  $("wArea").setAttribute("d", d + ` L ${pts[pts.length-1][0].toFixed(1)} ${H-PB} L ${pts[0][0].toFixed(1)} ${H-PB} Z`);

  const nodes = $("wNodes");
  nodes.textContent = "";
  idx.forEach((i,k) => {
    const x = nx(k), y = ny(h.temperature_2m[i]);
    const dot = document.createElementNS(NS, "circle");

    nodes.appendChild(dot);

    const [, kind] = wmoOf(h.weather_code[i]);
    const ig = document.createElementNS(NS, "g");
    ig.setAttribute("transform", `translate(${(x-9).toFixed(1)},${(y-34).toFixed(1)}) scale(1.14)`);
    ig.innerHTML = WX_SVG[kind] || WX_SVG.cloud;
    nodes.appendChild(ig);

    const tt = document.createElementNS(NS, "text");
    tt.setAttribute("x", x); tt.setAttribute("y", y - 37);
    tt.setAttribute("text-anchor", "middle"); tt.setAttribute("font-size", "11");
    tt.setAttribute("fill", "rgba(178,188,208,.78)");
    tt.textContent = h.time[i].slice(11,16);
    nodes.appendChild(tt);

    const tv = document.createElementNS(NS, "text");
    tv.setAttribute("x", x); tv.setAttribute("y", y + 18);
    tv.setAttribute("text-anchor", "middle"); tv.setAttribute("font-size", "12");
    tv.setAttribute("font-weight", "700"); tv.setAttribute("fill", "#dbe3f0");
    tv.textContent = Math.round(h.temperature_2m[i]) + "°";

  });
}

/* ============ MCSR ============ */
function statLine(s){
  if (!s) return "—";
  const g = (o,k) => (o && o[k]) || 0;
  const w = g(s.wins,"ranked"), l = g(s.loses,"ranked");
  const played = g(s.playedMatches,"ranked"), ff = g(s.forfeits,"ranked");
  const comp = g(s.completions,"ranked"), compTime = g(s.completionTime,"ranked");
  const pb = g(s.bestTime,"ranked"), streak = g(s.highestWinStreak,"ranked");
  const wr = (w+l) > 0 ? Math.round(w/(w+l)*100) : 0;
  const avg = comp > 0 ? Math.round(compTime/comp) : 0;
  const fr = played > 0 ? Math.round(ff/played*100) : 0;
  // 每块内部两格：左格「数字在左、标签贴中线」，右格「标签贴中线、数字在右」，
  // SEASON 与 TOTAL 用完全相同的排法，不再镜像
  const L = (num, label) => `<span class="v"><b>${num}</b><i>${label}</i></span>`;
  const R = (num, label) => `<span class="v"><i>${label}</i><b>${num}</b></span>`;
  return L(`${wr}%`, "wr") + R(`${fr}%`, "ffr")
       + L(ms2mmss(pb), "pb") + R(`${streak}`, "bws")
       + L(ms2mmss(avg), "avg") + `<span class="v"></span>`;
}
function applyTier(elo){
  const {tier, label} = tierOf(elo);
  document.documentElement.style.setProperty("--tier", tier.color);
  document.documentElement.style.setProperty("--tier-soft", hexA(tier.color,.14));
  $("mcTier").textContent = label;
  $("mcBadge").style.color = tier.color;
  return tier;
}
function countUp(el, to, dur = 1100, suffix = ""){
  const t0 = performance.now();
  const step = t => {
    const p = Math.min(1, (t-t0)/dur);
    el.textContent = Math.round(to * (1 - Math.pow(1-p,4))) + suffix;
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ============ ELO 折线（分段着色） ============ */
function drawElo(matches, curElo, color){
  if (!matches || !matches.length) return;
  const pts = [];
  for (const m of matches){
    const c = (m.changes || []).find(x => x.uuid === CFG.uuid);
    if (c && typeof c.eloRate === "number") pts.push({t:m.date, v:c.eloRate});
  }
  pts.sort((a,b) => a.t - b.t);
  if (pts.length < 2) return;
  if (curElo != null) pts.push({t: Date.now()/1000, v: curElo});

  const wrap = document.querySelector(".ch-wrap");
  const rc = wrap.getBoundingClientRect();
  const W = Math.max(240, Math.round(rc.width));
  const H = Math.max(90, Math.round(rc.height));
  $("eloSvg").setAttribute("viewBox", `0 0 ${W} ${H}`);

  const XL = 44, XR = 26, PT = 14, PB = 16;
  const plotW = W - XL - XR, plotH = H - PT - PB;
  const vals = pts.map(p => p.v);
  let lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);

  const up = TIERS.find(t => t.min > curElo) || null;
  let tierVal = null;
  if (up){
    const span = Math.max(hi-lo, 20);
    if (up.min <= hi + span*1.1){ hi = Math.max(hi, up.min); tierVal = up.min; }
  }
  const padV = Math.max(5, (hi-lo)*0.22);
  lo -= padV; hi += padV;
  if (hi - lo < 20){ const c = (hi+lo)/2; lo = c-10; hi = c+10; }

  // 纵轴步长：取 10 的整数倍；上下边界再对齐到刻度，
  // 这样网格正好铺满整个绘图区，折线任何一处上下都有虚线
  const rawStep = (hi - lo) / 5;
  const mag = Math.pow(10, Math.floor(Math.log10(Math.max(rawStep, 1))));
  const step = Math.max(10, Math.ceil(rawStep / mag) * mag);
  lo = Math.floor(lo / step) * step;
  hi = Math.ceil(hi / step) * step;

  // 视野内所有段位分界线
  const tierLines = TIERS.filter(t => t.min > 0 && t.min >= lo && t.min <= hi);

  const nx = i => XL + (i/(pts.length-1)) * plotW;
  const ny = v => PT + (1 - (v-lo)/(hi-lo)) * plotH;

  // 网格
  const grid = $("eloGrid");
  grid.textContent = "";
  for (let v = lo; v <= hi + 0.001; v += step){
    // 与段位线重合时刻度照写数字，只是不再画灰色虚线（那条线已经由段位线占据）
    const atTier = tierLines.some(t => Math.abs(v - t.min) < step * 0.5);
    const y = ny(v);
    if (!atTier){
      const ln = document.createElementNS(NS, "line");
      ln.setAttribute("x1", XL); ln.setAttribute("x2", W - XR);
      ln.setAttribute("y1", y); ln.setAttribute("y2", y);
      ln.setAttribute("stroke", "rgba(255,255,255,.085)");
      ln.setAttribute("stroke-width", "1");
      ln.setAttribute("stroke-dasharray", "3 6");
      grid.appendChild(ln);
    }

    const tx = document.createElementNS(NS, "text");
    tx.setAttribute("x", XL - 9);
    tx.setAttribute("y", y + 4);
    tx.setAttribute("text-anchor", "end");
    tx.setAttribute("font-size", "12");
    tx.setAttribute("font-weight", "600");
    tx.setAttribute("fill", "rgba(150,161,182,.85)");
    tx.textContent = v;
    grid.appendChild(tx);
  }

  // 段位分界线：右侧标注 "900 · GOLD"
  const tg = $("eloTierG");
  tg.textContent = "";
  for (const t of tierLines){
    const y = ny(t.min);
    const ln = document.createElementNS(NS, "line");
    ln.setAttribute("x1", XL); ln.setAttribute("x2", W - XR);
    ln.setAttribute("y1", y); ln.setAttribute("y2", y);
    ln.setAttribute("stroke", t.color);
    ln.setAttribute("stroke-width", "1.3");
    ln.setAttribute("stroke-dasharray", "8 5");
    ln.setAttribute("opacity", ".85");
    tg.appendChild(ln);

    // 不用底框（Safari 下 getComputedTextLength 与 letter-spacing 的实际渲染宽度
    // 对不上，框会跑偏），改成给文字描一圈深色描边，压住折线也看得清
    // 两层文字：底层深色描边打底，上层填色。不用 paint-order，
    // 老 Safari 不支持时会变成整块深色，这样写两个 text 一定正确
    const label = t.min + " · " + t.name.toUpperCase();
    const halo = document.createElementNS(NS, "text");
    halo.setAttribute("x", W - XR - 6);
    halo.setAttribute("y", y - 7);
    halo.setAttribute("text-anchor", "end");
    halo.setAttribute("font-size", "12");
    halo.setAttribute("font-weight", "700");
    halo.setAttribute("fill", "#0a0e15");
    halo.setAttribute("stroke", "#0a0e15");
    halo.setAttribute("stroke-width", "4");
    halo.setAttribute("stroke-linejoin", "round");
    halo.textContent = label;
    tg.appendChild(halo);

    const tx = document.createElementNS(NS, "text");
    tx.setAttribute("x", W - XR - 6);
    tx.setAttribute("y", y - 7);
    tx.setAttribute("text-anchor", "end");
    tx.setAttribute("font-size", "12");
    tx.setAttribute("font-weight", "700");
    tx.setAttribute("fill", t.color);
    tx.textContent = label;
    tg.appendChild(tx);
  }

  // 按段位区域切分折线：每条边都在穿越阈值处打断，颜色取该段中点所在区域
  const xy = pts.map((p,i) => ({x:nx(i), y:ny(p.v), v:p.v}));
  const thrs = TIERS.map(t => t.min).filter(m => m > 0);
  const cut = [xy[0]];
  for (let i = 1; i < xy.length; i++){
    const a = xy[i-1], b = xy[i];
    const loV = Math.min(a.v, b.v), hiV = Math.max(a.v, b.v);
    const cross = thrs.filter(m => m > loV && m < hiV);
    cross.sort((p,q) => (b.v > a.v ? p - q : q - p));
    for (const th of cross){
      const k = (th - a.v) / (b.v - a.v);
      cut.push({x: a.x + (b.x-a.x)*k, y: a.y + (b.y-a.y)*k, v: th});
    }
    cut.push(b);
  }

  const segs = [];
  let curSeg = null, curColor = null;
  for (let i = 1; i < cut.length; i++){
    const a = cut[i-1], b = cut[i];
    const c = tierOf((a.v + b.v) / 2).tier.color;
    if (!curSeg){ curSeg = [a, b]; curColor = c; }
    else if (c === curColor){ curSeg.push(b); }
    else { segs.push({color: curColor, pts: curSeg}); curSeg = [a, b]; curColor = c; }
  }
  if (curSeg && curSeg.length > 1) segs.push({color: curColor, pts: curSeg});

  const wrapSeg = $("eloSegs");
  wrapSeg.textContent = "";
  const anims = [];
  segs.forEach(sg => {
    let d = "";
    sg.pts.forEach((p,k) => { d += (k ? " L " : "M ") + p.x.toFixed(1) + " " + p.y.toFixed(1); });
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", d);
    p.setAttribute("fill", "none");
    p.setAttribute("stroke", sg.color);
    p.setAttribute("stroke-width", "2.3");
    p.setAttribute("stroke-linejoin", "miter");
    p.setAttribute("stroke-linecap", "butt");
    wrapSeg.appendChild(p);
    anims.push(p);
  });

  const last = xy[xy.length-1];
  const dot = $("eloLast");
  dot.setAttribute("cx", last.x);
  dot.setAttribute("cy", last.y);
  dot.setAttribute("fill", color);

  // 生长动画
  if (!__eloAnimated){
    __eloAnimated = true;
    anims.forEach(p => {
      const L = p.getTotalLength();
      p.style.transition = "none";
      p.style.strokeDasharray = L;
      p.style.strokeDashoffset = L;
    });
    requestAnimationFrame(() => {
      anims.forEach(p => {
        const L = p.getTotalLength();
        p.style.transition = `stroke-dashoffset ${(1.1 + L/1400).toFixed(2)}s cubic-bezier(.22,.9,.28,1)`;
        p.style.strokeDashoffset = 0;
      });
    });
    dot.style.transition = "none";
    dot.style.opacity = 0;
    requestAnimationFrame(() => {
      dot.style.transition = "opacity .4s ease 1.2s";
      dot.style.opacity = 1;
    });
  } else {
    anims.forEach(p => { p.style.transition = "none"; p.style.strokeDashoffset = 0; p.style.strokeDasharray = "none"; });
    dot.style.transition = "none";
    dot.style.opacity = 1;
  }

  placeLatestCard(xy, W, H);
}

/* 悬浮卡片自动选角落：折线在四个角哪块最空就待在哪，差异不明显时不挪窝 */
let __ltSpot = -1, __ltScore = Infinity;
function placeLatestCard(xy, W, H){
  const card = $("ltCard");
  if (!card || card.style.display === "none") return;
  const cw = card.offsetWidth || 268;
  const ch = card.offsetHeight || 62;
  const gap = 4;
  const spots = [
    { x: W - cw - 2, y: gap },
    { x: 2, y: gap },
    { x: W - cw - 2, y: H - ch - gap },
    { x: 2, y: H - ch - gap },
  ];
  const samples = [];
  for (let i = 1; i < xy.length; i++){
    const a = xy[i-1], b = xy[i];
    for (let k = 0; k <= 6; k++){
      samples.push({ x: a.x + (b.x - a.x) * k / 6, y: a.y + (b.y - a.y) * k / 6 });
    }
  }
  let best = 0, bestScore = Infinity;
  spots.forEach((s, i) => {
    let n = 0;
    for (const p of samples){
      if (p.x >= s.x - 8 && p.x <= s.x + cw + 8 && p.y >= s.y - 8 && p.y <= s.y + ch + 8) n++;
    }
    n += i * 0.01;                                   // 平手时优先右上 > 左上 > 右下 > 左下
    if (n < bestScore){ bestScore = n; best = i; }
  });
  if (best === __ltSpot) return;
  if (__ltSpot >= 0 && bestScore > __ltScore - 5) return;  // 迟滞，避免来回跳
  __ltSpot = best;
  __ltScore = bestScore;
  const s = spots[best];
  card.style.right = "auto";
  card.style.left = Math.max(0, Math.min(Math.round(s.x), W - cw)) + "px";
  card.style.top = Math.round(s.y) + "px";
}

/* ============ 近 10 场 ============ */
const OVW_IDX = {VILLAGE:0, SHIPWRECK:1, DESERT_TEMPLE:2, BURIED_TREASURE:3, RUINED_PORTAL:4, JUNGLE_TEMPLE:5};
const NTH_IDX = {TREASURE:6, BRIDGE:7, HOUSING:8, STABLES:9};

function prettyName(k){
  if (!k) return "—";
  return k.toLowerCase().split("_").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
}

/* 折线右上角：最新一局 */
function renderLatest(ms){
  const card = $("ltCard");
  if (!card) return;
  if (!ms || !ms.length){ card.style.display = "none"; return; }
  card.style.display = "";
  const m = ms[0];
  const me = CFG.uuid;
  const res = m.result || {};
  const opp = (m.players || []).find(x => x.uuid !== me) || {};

  let outcome = "DRAW";
  if (res.uuid) outcome = res.uuid === me ? "WIN" : "LOSE";
  $("ltRes").textContent = outcome === "WIN" ? "WON" : outcome === "LOSE" ? "LOST" : "DRAW";
  $("ltRes").className = "lt-res " + outcome;

  const ff = !!(m.forfeited && res.uuid);
  $("ltTime").textContent = ff ? "FORFEIT" : ms2mmss(res.time || 0);
  $("ltAgo").textContent = ago(m.date);
  $("ltOpp").textContent = opp.nickname || "—";

  const seed = m.seed || {};
  const setMap = (el, k, map) => {
    const idx = (k in map) ? map[k] : -1;
    el.className = "ic lt-ic" + (idx >= 0 ? " i" + idx : "");
    if (idx < 0){ el.style.backgroundImage = "none"; el.style.background = "rgba(255,255,255,.05)"; }
    else { el.style.backgroundImage = ""; el.style.background = ""; }
  };
  setMap($("ltOvw"), seed.overworld, OVW_IDX);
  setMap($("ltNth"), seed.nether, NTH_IDX);

  const ch = (m.changes || []).find(c => c.uuid === me) || {};
  const before = typeof ch.eloRate === "number" ? ch.eloRate : null;
  const delta = typeof ch.change === "number" ? ch.change : null;
  const after = (before !== null && delta !== null) ? before + delta : null;

  const t = tierOf(after !== null ? after : (__eloNow || 0));
  $("ltTier").textContent = t.label.toUpperCase();
  $("ltElo").textContent = after !== null ? after : "—";
  $("ltDelta").innerHTML = (delta === null || before === null) ? ""
    : `<b class="${delta >= 0 ? "up" : "down"}">${delta > 0 ? "+" : ""}${delta}</b> from ${before}`;
  card.style.setProperty("--tier", t.tier.color);
}

function renderMatches(ms, season){
  if (!ms || !ms.length) return;
  const me = CFG.uuid;
  const list = ms.slice(0,10).map(m => {
    const opp = (m.players || []).find(p => p.uuid !== me) || {};
    const res = m.result || null;
    const myCh = (m.changes || []).find(c => c.uuid === me);
    // result.uuid 为空才是平局；平局因分差也可能有 ±1 / ±2 的分值变化，不能按 change 正负判断
    let outcome = "DRAW";
    if (res && res.uuid) outcome = res.uuid === me ? "WIN" : "LOSE";
    // 投降是独立的 forfeited 字段，此时时间列显示 FORFEIT
    const ff = !!(m.forfeited && res && res.uuid);
    const timeMs = (res && res.time) || 0;
    const seed = m.seed || {};
    return {
      outcome,
      opp: opp.nickname || "—",
      time: timeMs,
      ff,
      ovw: (seed.overworld in OVW_IDX) ? OVW_IDX[seed.overworld] : -1,
      nth: (seed.nether in NTH_IDX) ? NTH_IDX[seed.nether] : -1,
      ts: m.date
    };
  });

  // 头部是本赛季累计，不是这 10 场；平局数用 总场次 - 胜 - 负 反推
  const g = (o,k) => (o && o[k]) || 0;
  const sw = g(season && season.wins, "ranked");
  const sl = g(season && season.loses, "ranked");
  const sp = g(season && season.playedMatches, "ranked") || (sw + sl);
  const sd = Math.max(0, sp - sw - sl);
  $("mtPlayed").textContent = sp;
  $("mtWin").textContent = sw;
  $("mtLose").textContent = sl;
  $("mtDraw").textContent = sd;

  $("mtList").innerHTML = list.map((x,i) => {
    const tc = x.outcome === "WIN" ? "mt-time" : "mt-time dim";
    return `<div class="mt-row" style="animation-delay:${i*38}ms">
      <span class="mt-opp">${esc(x.opp)}</span>
      <span class="mt-res ${x.outcome}">${x.outcome}</span>
      ${x.ff ? `<span class="mt-time ff">FORFEIT</span>` : `<span class="${tc}">${ms2mmss(x.time)}</span>`}
      ${x.ovw >= 0 ? `<span class="ic i${x.ovw}"></span>` : `<span class="ic" style="background-image:none;background:rgba(255,255,255,.05)"></span>`}
      ${x.nth >= 0 ? `<span class="ic i${x.nth}"></span>` : `<span class="ic" style="background-image:none;background:rgba(255,255,255,.05)"></span>`}
      <span class="mt-ago">${ago(x.ts)}</span>
    </div>`;
  }).join("");
}

/* ============ 轮播 ============ */
let swapIdx = 0;
let swapTimer = null;
let swapLock = 0;
function syncDots(){}
function armSwap(){
  clearTimeout(swapTimer);
  swapTimer = setTimeout(swapPanes, CFG.swapMs);
}
function swapPanes(dir){
  // dir = 1：手指上滑，新页从下面来；dir = -1：手指下滑，新页从上面来
  if (dir === undefined) dir = 1;
  const t = performance.now();
  if (t - swapLock < 900){ armSwap(); return; }   // 动画没走完不接受新的切换
  swapLock = t;

  const panes = [$("paneChart"), $("paneList")];
  const cur = panes[swapIdx];
  const next = panes[1-swapIdx];
  swapIdx = 1 - swapIdx;

  const enterFrom = dir > 0 ? 107 : -106;   // 新页从哪一侧进入
  const exitTo    = dir > 0 ? -106 : 107;   // 旧页往哪一侧离开

  next.style.transition = "none";
  next.style.transform = `translateY(${enterFrom}%)`;
  next.style.opacity = "0";
  next.style.pointerEvents = "none";
  void next.offsetWidth;
  next.style.transition = "";

  cur.style.transform = `translateY(${exitTo}%)`;
  cur.style.opacity = "0";
  cur.style.pointerEvents = "none";

  requestAnimationFrame(() => {
    next.style.transform = "translateY(0)";
    next.style.opacity = "1";
    next.style.pointerEvents = "auto";
  });

  syncDots();
  armSwap();          // 手动滑动后也是从这一刻重新计时
}

/* 手势：横滑或竖滑都切换，滑动一次只切一屏 */
(function swipe(){
  const el = document.querySelector(".swap");
  let x0 = 0, y0 = 0, t0 = 0, down = false;
  el.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    down = true; x0 = e.clientX; y0 = e.clientY; t0 = performance.now();
  });
  el.addEventListener("pointerup", e => {
    if (!down) return;
    down = false;
    if (performance.now() - t0 > 900) return;
    const dx = e.clientX - x0, dy = e.clientY - y0;
    const ax = Math.abs(dx), ay = Math.abs(dy);
    if (ay > ax && ay > 42) swapPanes(dy < 0 ? 1 : -1);
    else if (ax > ay && ax > 56) swapPanes(dx < 0 ? 1 : -1);
  });
  el.addEventListener("pointercancel", () => { down = false; });
})();

  l.style.transform = "translateY(0)"; l.style.opacity = "1"; l.style.pointerEvents = "auto";
  swapIdx = 1;
  syncDots();
}
