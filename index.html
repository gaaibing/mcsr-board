<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="看板">
<meta name="theme-color" content="#07080c">

<title>看板</title>
<style>
:root{
  --bg:#07080c;
  --tile-1:#161b26;
  --tile-2:#0d1017;
  --tile-3:#0a0c11;
  --line:rgba(255,255,255,.075);
  --line-soft:rgba(255,255,255,.045);
  --text:#e9edf5;
  --dim:#7d869b;
  --dim-2:#5d657a;
  --tier:#c9ccd6;
  --tier-soft:rgba(201,204,214,.14);
  --accent-warm:#ffab5e;
  --accent-cool:#58c7ff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
  user-select:none;
  position:relative;
}
body::before{
  content:"";
  position:fixed;inset:0;
  background:
    radial-gradient(120% 80% at 12% -10%, rgba(88,199,255,.10), transparent 55%),
    radial-gradient(90% 70% at 105% 105%, rgba(160,108,255,.09), transparent 60%),
    radial-gradient(70% 60% at 50% 50%, rgba(255,255,255,.018), transparent 70%);
  pointer-events:none;
  z-index:0;
}
.board{
  position:relative;z-index:1;
  height:100vh;height:100dvh;
  display:grid;
  grid-template-columns:repeat(12,1fr);
  grid-template-rows:repeat(10,1fr);
  gap:14px;
  padding:16px;
}

/* ---------- 磁吸卡片基底 ---------- */
.tile{
  position:relative;
  border-radius:26px;
  padding:18px 20px;
  background:linear-gradient(163deg,var(--tile-1) 0%,var(--tile-2) 52%,var(--tile-3) 100%);
  border:1px solid var(--line);
  box-shadow:
    0 22px 48px -26px rgba(0,0,0,.95),
    0 2px 6px -2px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(255,255,255,.055);
  overflow:hidden;
  display:flex;flex-direction:column;
  animation:tileIn .95s cubic-bezier(.19,1.28,.32,1) both;
  transition:transform .55s cubic-bezier(.34,1.5,.64,1),border-color .4s ease,box-shadow .5s ease;
  will-change:transform;
}
.tile::after{
  content:"";
  position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.05),transparent 32%);
  opacity:.75;
}
.tile:hover{
  transform:translateY(-3px) scale(1.004);
  border-color:rgba(255,255,255,.14);
  box-shadow:
    0 30px 60px -28px rgba(0,0,0,.95),
    0 0 0 1px rgba(255,255,255,.03),
    inset 0 1px 0 rgba(255,255,255,.09);
}
@keyframes tileIn{
  0%{opacity:0;transform:translateY(26px) scale(.955)}
  60%{opacity:1}
  100%{opacity:1;transform:none}
}

.clock{grid-area:1/1/4/9;animation-delay:.04s}
.weather{grid-area:1/9/5/13;animation-delay:.11s;cursor:default}
.mcsr{grid-area:4/1/8/9;animation-delay:.18s}
.chart{grid-area:8/1/11/9;animation-delay:.25s}
.schedule{grid-area:5/9/11/13;animation-delay:.32s}

.cap{
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim-2);font-weight:600;
}

/* ---------- 时钟 ---------- */
.clock{justify-content:space-between}
.clock-top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}
.clock-time{
  font-size:clamp(58px,14.2vh,134px);
  line-height:.86;font-weight:600;letter-spacing:-.045em;
  display:flex;align-items:baseline;gap:.02em;
  font-feature-settings:"tnum";
}
.clock-time .sec{
  font-size:.26em;font-weight:500;color:var(--dim);
  letter-spacing:0;margin-left:.06em;
}
.clock-time .colon{
  animation:breathe 2s ease-in-out infinite;
  transition:opacity .2s;
}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.32}}
.clock-meta{text-align:right;display:flex;flex-direction:column;gap:6px;padding-top:4px}
.clock-date{font-size:clamp(13px,1.85vh,19px);font-weight:600;color:#cfd6e4}
.clock-week{font-size:clamp(11px,1.4vh,14px);color:var(--dim)}
.clock-terms{font-size:clamp(10px,1.2vh,12px);color:var(--dim-2);letter-spacing:.04em}
.daybar{
  height:5px;border-radius:99px;background:rgba(255,255,255,.06);
  overflow:hidden;margin-top:auto;position:relative;
}
.daybar span{
  display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,rgba(88,199,255,.9),rgba(160,108,255,.9));
  transition:width 1s cubic-bezier(.22,.9,.28,1);
  box-shadow:0 0 12px rgba(88,199,255,.5);
}
.daybar-meta{display:flex;justify-content:space-between;margin-top:7px;font-size:10.5px;color:var(--dim-2);letter-spacing:.05em}

/* ---------- 天气 ---------- */
.weather-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.w-city{font-size:13px;font-weight:600;color:#cfd6e4;display:flex;align-items:center;gap:5px}
.w-city i{font-style:normal;font-size:9px;color:var(--dim-2);letter-spacing:.1em}
.w-now{display:flex;align-items:center;gap:10px;margin-top:6px}
.w-temp{
  font-size:clamp(34px,6.4vh,58px);line-height:1;font-weight:600;letter-spacing:-.035em;
  background:linear-gradient(180deg,#fff,#9fd8ff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.w-icon{font-size:clamp(24px,4.6vh,40px);line-height:1;filter:drop-shadow(0 4px 14px rgba(88,199,255,.3))}
.w-desc{font-size:11.5px;color:var(--dim);margin-top:2px}
.w-facts{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}
.w-fact{font-size:10.5px;color:var(--dim-2);display:flex;gap:4px}
.w-fact b{color:#a8b2c6;font-weight:500}
.w-hours{
  display:grid;grid-template-columns:repeat(6,1fr);
  gap:5px;margin-top:auto;padding-top:10px;
}
.w-h{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 1px;border-radius:11px;
  background:rgba(255,255,255,.028);
  border:1px solid rgba(255,255,255,.035);
  transition:background .3s,transform .5s cubic-bezier(.34,1.5,.64,1);
  animation:hourIn .7s cubic-bezier(.19,1.28,.32,1) both;
}
@keyframes hourIn{0%{opacity:0;transform:translateY(10px) scale(.9)}100%{opacity:1;transform:none}}
.w-h:hover{background:rgba(88,199,255,.1);transform:translateY(-2px)}
.w-h .h-t{font-size:9.5px;color:var(--dim-2);letter-spacing:0}
.w-h .h-i{font-size:15px;line-height:1.05}
.w-h .h-v{font-size:11.5px;font-weight:600;color:#dbe3f0}
.w-h .h-p{font-size:8.5px;color:var(--accent-cool);min-height:10px;line-height:1}

/* ---------- MCSR ---------- */
.mcsr{flex-direction:row;align-items:center;gap:18px;padding:18px 22px}
.mc-head{
  width:clamp(88px,13.5vh,152px);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  position:relative;align-self:center;
}
.mc-head img{
  width:100%;height:auto;display:block;
  filter:drop-shadow(0 16px 28px rgba(0,0,0,.8));
  animation:headFloat 6s ease-in-out infinite;
}
@keyframes headFloat{
  0%,100%{transform:translateY(0) rotate(-2deg)}
  50%{transform:translateY(-7px) rotate(2deg)}
}
.mc-body{flex:1;display:flex;flex-direction:column;min-width:0;justify-content:center;gap:16px;align-self:stretch;padding:2px 0}
.mc-info{display:flex;flex-direction:column;gap:8px;min-width:0}
.mc-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mc-id{display:flex;align-items:baseline;gap:9px;min-width:0}
.mc-rank{
  font-size:clamp(15px,2.1vh,21px);font-weight:700;color:var(--dim);letter-spacing:-.02em;
}
.mc-flag{font-size:clamp(13px,1.8vh,17px);line-height:1}
.mc-name{
  font-size:clamp(20px,3.1vh,34px);font-weight:700;letter-spacing:-.02em;
  color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.mc-season{
  font-size:10px;letter-spacing:.14em;color:var(--dim-2);font-weight:600;
  display:flex;align-items:center;gap:5px;flex:0 0 auto;
}
.mc-season .dot{width:5px;height:5px;border-radius:50%;background:var(--tier);box-shadow:0 0 8px var(--tier)}

.mc-tierline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:2px}
.mc-badge{
  display:inline-flex;align-items:center;gap:7px;
  padding:5px 13px 5px 10px;border-radius:99px;
  background:var(--tier-soft);
  border:1px solid color-mix(in srgb,var(--tier) 34%,transparent);
  color:var(--tier);
  font-size:clamp(13px,1.85vh,18px);font-weight:700;letter-spacing:.01em;
  box-shadow:0 0 22px -6px color-mix(in srgb,var(--tier) 55%,transparent),
             inset 0 1px 0 color-mix(in srgb,var(--tier) 20%,transparent);
  transition:box-shadow .6s ease,transform .5s cubic-bezier(.34,1.5,.64,1);
}
.mc-badge svg{width:1em;height:1em;flex:0 0 auto}
.mc-elo{
  font-size:clamp(12px,1.7vh,16px);color:var(--dim);
}
.mc-elo b{color:var(--text);font-weight:600}
.mc-peak{font-size:clamp(11px,1.5vh,14px);color:var(--dim-2)}

.mc-stats{
  display:grid;grid-template-columns:repeat(5,1fr);gap:8px;
}
.stat{
  padding:9px 10px;border-radius:14px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.04);
  display:flex;flex-direction:column;gap:2px;
  transition:background .35s,border-color .35s;
}
.stat:hover{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.09)}
.stat .v{font-size:clamp(18px,3vh,31px);font-weight:700;letter-spacing:-.025em;color:#fff;line-height:1.1}
.stat .v small{font-size:.55em;font-weight:600;color:var(--dim);margin-left:1px}
.stat .k{font-size:9.5px;letter-spacing:.09em;color:var(--dim-2);text-transform:uppercase;font-weight:600}
.stat.hot .v{color:var(--tier)}

/* ---------- ELO 折线 ---------- */
.chart{padding:16px 20px 12px}
.chart-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.chart-title{font-size:12.5px;font-weight:600;color:#c3cbd9;letter-spacing:.02em}
.chart-delta{font-size:12px;font-weight:700;letter-spacing:.01em}
.chart-wrap{flex:1;position:relative;min-height:0}
.chart-wrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.chart-labels{position:absolute;inset:0;pointer-events:none}
.chart-labels .lo,.chart-labels .hi{
  position:absolute;left:0;font-size:10px;color:var(--dim-2);font-weight:600;letter-spacing:.03em;
}
.chart-labels .lo{bottom:6px}
.chart-labels .hi{top:6px}

/* ---------- 课表 ---------- */
.schedule{padding:16px 18px}
.sc-block{display:flex;flex-direction:column;gap:7px;flex:1;min-height:0}
.sc-head{display:flex;align-items:baseline;justify-content:space-between}
.sc-title{font-size:12.5px;font-weight:700;color:#dbe3f0;letter-spacing:.02em}
.sc-sub{font-size:10.5px;color:var(--dim-2)}
.sc-list{display:flex;flex-direction:column;gap:7px;margin-top:6px;flex:1;min-height:0}
.sc-item{
  display:flex;gap:10px;padding:9px 11px;border-radius:14px;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.04);
  transition:background .35s,transform .5s cubic-bezier(.34,1.5,.64,1),opacity .4s;
  animation:scIn .7s cubic-bezier(.19,1.28,.32,1) both;
}
@keyframes scIn{0%{opacity:0;transform:translateX(12px)}100%{opacity:1;transform:none}}
.sc-item.live{
  background:linear-gradient(100deg,rgba(255,171,94,.14),rgba(255,171,94,.045));
  border-color:rgba(255,171,94,.32);
  box-shadow:0 0 26px -10px rgba(255,171,94,.55);
}
.sc-item.past{opacity:.34}
.sc-p{
  flex:0 0 auto;width:34px;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding-top:1px;
}
.sc-p .n{font-size:13px;font-weight:700;color:#cfd6e4;line-height:1}
.sc-p .r{font-size:8.5px;color:var(--dim-2);letter-spacing:.04em}
.sc-item.live .sc-p .n{color:var(--accent-warm)}
.sc-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sc-name{
  font-size:13px;font-weight:600;color:#e2e8f2;line-height:1.25;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.sc-name .tag{
  font-size:9px;font-weight:600;padding:1px 5px;border-radius:5px;margin-left:5px;
  background:rgba(255,255,255,.07);color:var(--dim);letter-spacing:.03em;vertical-align:1px;
}
.sc-where{font-size:10.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-time{font-size:10px;color:var(--dim-2)}
.sc-empty{
  flex:1;display:flex;align-items:center;justify-content:center;
  font-size:11.5px;color:var(--dim-2);padding:12px 4px;text-align:center;
  border:1px dashed rgba(255,255,255,.08);border-radius:13px;letter-spacing:.03em;
  min-height:56px;
}
.sc-sep{height:1px;background:var(--line-soft);margin:12px 0 10px}
.sc-foot{
  margin-top:auto;padding-top:11px;border-top:1px solid var(--line-soft);
  font-size:10.5px;color:var(--dim-2);letter-spacing:.02em;
  display:flex;justify-content:space-between;align-items:center;gap:8px;
}
.sc-foot b{color:#aeb8cc;font-weight:600}
.sc-foot .nx{color:var(--accent-warm);font-weight:600}

/* ---------- 竖屏降级 ---------- */
@media (orientation:portrait){
  html,body{overflow:auto}
  .board{
    height:auto;min-height:100dvh;
    grid-template-columns:1fr;grid-template-rows:none;
    gap:12px;padding:14px;
  }
  .clock,.weather,.mcsr,.chart,.schedule{grid-area:auto}
  .clock{min-height:180px}
  .weather{min-height:230px}
  .mcsr{min-height:230px;flex-direction:column}
  .mc-head{width:88px;align-self:flex-start}
  .mcsr{flex-direction:row}
  .chart{min-height:190px}
  .schedule{min-height:auto}
  .mc-head img{width:100%}
}
@media (max-width:900px){
  .clock-time{font-size:clamp(48px,11vh,80px)}
  .mc-stats{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>

function weekOf(d){
  const t0 = new Date(CFG.semesterStart + "T00:00:00");
  const t1 = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const days = Math.floor((t1 - t0) / 86400000);

  const mins = nowMin();
  const pct = Math.min(100, mins / 1440 * 100);
  $("daybar").style.width = pct.toFixed(2) + "%";
  const left = 1440 - mins;
  $("dayLeft").textContent = `今天还剩 ${Math.floor(left/60)} 小时 ${Math.floor(left%60)} 分`;
  $("dayPct").textContent = `${pct.toFixed(1)}% 已过`;
}

/* ============ 课表渲染 ============ */
function coursesOn(date, week){
  const d = date.getDay() === 0 ? 7 : date.getDay(); // 周一=1…周日=7
  return TIMETABLE.filter(c => c.d === d && c.w.includes(week))
    .sort((a,b) => a.s - b.s);
}

function courseHTML(c, state, idx){
  const st = periodTime(c.s), et = periodTime(c.e);
  const cls = state === "live" ? "sc-item live" : state === "past" ? "sc-item past" : "sc-item";
  return `<div class="${cls}" style="animation-delay:${idx*55}ms">
    <div class="sc-p"><span class="n">${c.s}${c.e>c.s? "-"+c.e : ""}</span><span class="r">${st.a}</span></div>
    <div class="sc-main">
      <span class="sc-name">${c.n}${c.t && c.t!=="讲课" ? `<span class="tag">${c.t}</span>` : ""}</span>
      <span class="sc-where">${c.p} · ${c.tc}</span>
      <span class="sc-time">${st.a} – ${et.b}</span>
    </div>
  </div>`;
}

function nextClass(){
  const now = new Date();
  const mins = nowMin();
  for (let off = 0; off < 21; off++){
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + off);
    const w = weekOf(d);
    for (const c of coursesOn(d, w)){
      const t = periodTime(c.s);
      if (off === 0 && t.end <= mins) continue;
      return {date: d, c, off};
    }
  }
  return null;
}

function renderSchedule(){
  const now = new Date();
  const w = weekOf(now);
  const mins = nowMin();

  // 今天
  const today = coursesOn(now, w);
  const remaining = today.filter(c => periodTime(c.e).end > mins);
  $("todayTitle").textContent = `今天 · ${WEEK_SHORT[now.getDay()]}`;
  $("todaySub").textContent = `第 ${w} 周 · ${today.length ? `${remaining.length}/${today.length} 节待上` : "无课"}`;

  const tl = $("todayList");
  if (!remaining.length){
    tl.innerHTML = `<div class="sc-empty">${today.length ? "今天的课都上完了" : "今天没有课"}</div>`;
  } else {
    tl.innerHTML = remaining.map((c,i) => {
      const live = periodTime(c.s).start <= mins && periodTime(c.e).end > mins;
      return courseHTML(c, live ? "live" : "now", i);
    }).join("");
  }

  // 明天
  const tmr = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1);
  const wm = weekOf(tmr);
  const list = coursesOn(tmr, wm);
  $("tmrTitle").textContent = `明天 · ${WEEK_SHORT[tmr.getDay()]}`;
  $("tmrSub").textContent = list.length ? `${list.length} 节课` : "没有课";

  const ml = $("tmrList");
  ml.innerHTML = list.length
    ? list.map((c,i) => courseHTML(c, "future", i)).join("")
    : `<div class="sc-empty">明天没有课</div>`;

  // 下一次课
  const nx = nextClass();
  if (nx){
    const st = periodTime(nx.c.s);
    const dayTxt = nx.off === 0 ? "今天" : nx.off === 1 ? "明天" : WEEK_SHORT[nx.date.getDay()];
    $("scFoot").innerHTML =
      `<span>下次 · <b>${dayTxt}</b> ${st.a}</span><span class="nx">${nx.c.n}</span>`;
  } else {
    $("scFoot").innerHTML = `<span>未来三周没有课</span>`;
  }
}

/* ============ 天气 ============ */
const WMO = {
  0:["晴","☀️"],1:["大部晴","🌤️"],2:["多云","⛅"],3:["阴","☁️"],
  45:["雾","🌫️"],48:["冻雾","🌫️"],
  51:["小毛雨","🌦️"],53:["毛雨","🌦️"],55:["大毛雨","🌦️"],56:["冻毛雨","🌧️"],57:["冻毛雨","🌧️"],
  61:["小雨","🌧️"],63:["中雨","🌧️"],65:["大雨","🌧️"],66:["冻雨","🌧️"],67:["冻雨","🌧️"],
  71:["小雪","🌨️"],73:["中雪","🌨️"],75:["大雪","🌨️"],77:["雪粒","🌨️"],
  80:["阵雨","🌦️"],81:["强阵雨","🌧️"],82:["暴阵雨","⛈️"],
  85:["阵雪","🌨️"],86:["强阵雪","🌨️"],
  95:["雷阵雨","⛈️"],96:["雷雨伴冰雹","⛈️"],99:["强雷雨冰雹","⛈️"]
};
const wmoOf = c => WMO[c] || ["未知","·"];

async function loadWeather(){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${CFG.lat}&longitude=${CFG.lng}`
    + `&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m`
    + `&hourly=temperature_2m,precipitation_probability,weather_code`
    + `&timezone=Asia%2FShanghai&forecast_days=2`;
  let data;
  try{
    const r = await fetch(url, {cache:"no-store"});
    data = await r.json();
    store.set("weather", {t:Date.now(), data});
  }catch(e){
    const c = store.get("weather", null);
    if (!c) return;
    data = c.data;
  }
  paintWeather(data);
}

function paintWeather(d){
  if (!d || !d.current) return;
  const cur = d.current;
  const [desc, icon] = wmoOf(cur.weather_code);
  $("wTemp").textContent = Math.round(cur.temperature_2m) + "°";
  $("wIcon").textContent = icon;
  $("wDesc").textContent = desc;
  $("wFeel").textContent = Math.round(cur.apparent_temperature) + "°";
  $("wHum").textContent = Math.round(cur.relative_humidity_2m) + "%";
  $("wWind").textContent = Math.round(cur.wind_speed_10m) + " km/h";

  // 取当前时间之后 12 小时
  const h = d.hourly;
  if (!h || !h.time) return;
  const nowH = new Date();
  const curKey = `${nowH.getFullYear()}-${pad(nowH.getMonth()+1)}-${pad(nowH.getDate())}T${pad(nowH.getHours())}:00`;
  let start = h.time.findIndex(x => x >= curKey);
  if (start < 0) start = 0;

  const box = $("wHours");
  box.innerHTML = "";
  for (let i = 1; i <= 12; i++){
    const k = start + i;
    if (k >= h.time.length) break;
    const [, ic] = wmoOf(h.weather_code[k]);
    const el = document.createElement("div");
    el.className = "w-h";
    el.style.animationDelay = (i*38) + "ms";
    el.innerHTML = `<span class="h-t">${h.time[k].slice(11,16)}</span>
      <span class="h-i">${ic}</span>
      <span class="h-v">${Math.round(h.temperature_2m[k])}°</span>
      <span class="h-p">${h.precipitation_probability[k] >= 20 ? h.precipitation_probability[k]+"%" : ""}</span>`;
    box.appendChild(el);
  }
}

/* ============ MCSR ============ */
function applyTier(elo){
  const {tier, label} = tierOf(elo);
  document.documentElement.style.setProperty("--tier", tier.color);
  document.documentElement.style.setProperty("--tier-soft", hexA(tier.color, .14));
  $("mcTier").textContent = label;
  $("mcBadge").style.color = tier.color;
  return label;
}
function hexA(hex, a){
  const h = hex.replace("#","");
  const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}

function countUp(el, to, dur = 1100, suffix = ""){
  const from = 0;
  const t0 = performance.now();
  const step = t => {
    const p = Math.min(1, (t - t0) / dur);
    const e = 1 - Math.pow(1 - p, 4);           // easeOutQuart
    const v = Math.round(from + (to - from) * e);
    el.textContent = v + suffix;
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

async function loadMCSR(){
  let user = null, matches = null;
  try{
    const [r1, r2] = await Promise.all([
      fetch(`https://api.mcsrranked.com/users/${CFG.user}`, {cache:"no-store"}),
      fetch(`https://api.mcsrranked.com/users/${CFG.user}/matches?count=30`, {cache:"no-store"})
    ]);
    user = (await r1.json()).data;
    matches = (await r2.json()).data;
    store.set("mcsr", {t:Date.now(), user, matches});
  }catch(e){
    const c = store.get("mcsr", null);
    if (!c) return;
    user = c.user; matches = c.matches;
  }
  paintMCSR(user, matches);
}

function paintMCSR(u, ms){
  if (!u) return;
  const elo = u.eloRate;
  const t = tierOf(elo);
  applyTier(elo);

  $("mcRank").textContent = "#" + (u.eloRank || "—");
  $("mcName").textContent = u.nickname || CFG.user;
  countUp($("mcElo"), elo, 1200);

  const sr = u.seasonResult || {};
  $("mcPeak").textContent = (sr.highest || "—") + " peak elo";

  const s = (u.statistics && u.statistics.season) || {};
  const w = s.wins ? s.wins.ranked : 0;
  const l = s.loses ? s.loses.ranked : 0;
  const played = s.playedMatches ? s.playedMatches.ranked : 0;
  const ff = s.forfeits ? s.forfeits.ranked : 0;
  const comp = s.completions ? s.completions.ranked : 0;
  const compTime = s.completionTime ? s.completionTime.ranked : 0;
  const pb = s.bestTime ? s.bestTime.ranked : 0;
  const streak = s.highestWinStreak ? s.highestWinStreak.ranked : 0;

  const winrate = (w + l) > 0 ? Math.round(w / (w + l) * 100) : 0;
  const avg = comp > 0 ? Math.round(compTime / comp) : 0;
  const ffrate = played > 0 ? Math.round(ff / played * 100) : 0;

  countUp($("sWin"), winrate, 1000, "%");
  $("sPb").textContent = ms2mmss(pb);
  $("sAvg").textContent = ms2mmss(avg);
  $("sStreak").textContent = streak;
  $("sFf").textContent = ffrate + "%";

  // 折线
  drawElo(ms, elo, t.tier.color);
}

function drawElo(matches, curElo, color){
  if (!matches || !matches.length) return;
  const pts = [];
  for (const m of matches){
    const c = (m.changes || []).find(x => x.uuid === CFG.uuid);
    if (c && typeof c.eloRate === "number") pts.push({t:m.date, v:c.eloRate});
  }
  pts.sort((a,b) => a.t - b.t);
  if (pts.length < 2) return;
  pts.push({t: Date.now()/1000, v: curElo});

  const W = 600, H = 140, X0 = 34, PADT = 16, PADB = 20;
  const vals = pts.map(p => p.v);
  let min = Math.min(...vals), max = Math.max(...vals);
  if (max - min < 20){ const c = (max+min)/2; min = c-10; max = c+10; }
  const nx = i => X0 + (i / (pts.length - 1)) * (W - X0 - 8);
  const ny = v => PADT + (1 - (v - min) / (max - min)) * (H - PADT - PADB);

  const xy = pts.map((p,i) => [nx(i), ny(p.v)]);

  // Catmull-Rom 转贝塞尔，得到平滑曲线
  let d = `M ${xy[0][0].toFixed(1)} ${xy[0][1].toFixed(1)}`;
  for (let i = 0; i < xy.length - 1; i++){
    const p0 = xy[i-1] || xy[i], p1 = xy[i], p2 = xy[i+1], p3 = xy[i+2] || p2;
    const c1x = p1[0] + (p2[0]-p0[0])/6, c1y = p1[1] + (p2[1]-p0[1])/6;
    const c2x = p2[0] - (p3[0]-p1[0])/6, c2y = p2[1] - (p3[1]-p1[1])/6;
    d += ` C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  const areaD = d + ` L ${W} ${H} L ${X0} ${H} Z`;

  const line = $("eloLine"), area = $("eloArea"), dot = $("eloLast");
  line.setAttribute("d", d);
  area.setAttribute("d", areaD);
  line.setAttribute("stroke", color);
  dot.setAttribute("cx", xy[xy.length-1][0]);
  dot.setAttribute("cy", xy[xy.length-1][1]);
  dot.setAttribute("fill", color);

  const len = line.getTotalLength();
  line.style.strokeDasharray = len;
  line.style.strokeDashoffset = len;
  line.style.transition = "none";
  requestAnimationFrame(() => {
    line.style.transition = "stroke-dashoffset 1.7s cubic-bezier(.22,.9,.28,1)";
    line.style.strokeDashoffset = 0;
  });
  dot.style.opacity = 0;
  dot.style.transition = "opacity .5s ease 1.4s";
  requestAnimationFrame(() => { dot.style.opacity = 1; });

  $("eloHi").textContent = max.toFixed(0);
  $("eloLo").textContent = min.toFixed(0);

  const delta = vals[vals.length-1] - vals[0];
  const el = $("chartDelta");
  el.textContent = (delta >= 0 ? "+" : "") + delta + " elo";
  el.style.color = delta >= 0 ? "#3fd07a" : "#ff6b6b";
}

/* ============ 启动 ============ */
tickClock();
setInterval(tickClock, 1000);
renderSchedule();
setInterval(() => { renderSchedule(); }, 60_000);

loadWeather();
setInterval(loadWeather, 10 * 60_000);

loadMCSR();
setInterval(loadMCSR, 5 * 60_000);

// 防止 iPad 休眠后回来后时间不刷新
document.addEventListener("visibilitychange", () => {
  if (!document.hidden){ tickClock(); renderSchedule(); loadWeather(); loadMCSR(); }
});

// Service Worker 离线缓存
if ("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
